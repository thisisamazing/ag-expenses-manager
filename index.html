    const getTodayFormatted = () => {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    };

    const getNowDateTimeFormatted = () => {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      const hh = String(today.getHours()).padStart(2, '0');
      const min = String(today.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
    };

    // Smart Date Parser supporting DD/MM/YYYY, MM/DD/YYYY, Excel serial numbers, and JS Dates
    const parseSmartDate = (raw, preferredFormat = 'auto') => {
      if (!raw) return { dateStr: getTodayFormatted(), timestamp: Date.now(), year: new Date().getFullYear(), month: new Date().getMonth() + 1, day: new Date().getDate() };

      // 1. If it's already a Date object
      if (raw instanceof Date && !isNaN(raw.getTime())) {
        const d = String(raw.getDate()).padStart(2, '0');
        const m = String(raw.getMonth() + 1).padStart(2, '0');
        const y = raw.getFullYear();
        return { dateStr: `${d}/${m}/${y}`, timestamp: raw.getTime(), year: y, month: raw.getMonth() + 1, day: raw.getDate() };
      }

      // 2. If it's an Excel numeric serial number (e.g. 45620)
      if (typeof raw === 'number' || (!isNaN(raw) && String(raw).trim().length >= 4 && !String(raw).includes('/') && !String(raw).includes('-') && !String(raw).includes('.'))) {
        const num = parseFloat(raw);
        if (num > 20000 && num < 60000) {
          const date = new Date(Math.round((num - 25569) * 86400 * 1000));
          if (!isNaN(date.getTime())) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return { dateStr: `${d}/${m}/${y}`, timestamp: date.getTime(), year: y, month: date.getMonth() + 1, day: date.getDate() };
          }
        }
      }

      // 3. String date parsing
      const str = String(raw).trim();
      const parts = str.split(/[\/\-\.]/);
      if (parts.length === 3) {
        let p0 = parseInt(parts[0], 10);
        let p1 = parseInt(parts[1], 10);
        let yearPart = parts[2].trim();
        let year = parseInt(yearPart.length === 2 ? `20${yearPart}` : yearPart, 10);

        let day = p0;
        let month = p1;

        if (preferredFormat === 'mdy' || (preferredFormat === 'auto' && p0 <= 12 && p1 > 12)) {
          // Month-Day-Year
          month = p0;
          day = p1;
        } else if (p0 > 12 && p1 <= 12) {
          // Day-Month-Year
          day = p0;
          month = p1;
        } else if (preferredFormat === 'dmy') {
          day = p0;
          month = p1;
        }

        const validDate = new Date(year, month - 1, day);
        const dStr = String(day).padStart(2, '0');
        const mStr = String(month).padStart(2, '0');
        return {
          dateStr: `${dStr}/${mStr}/${year}`,
          timestamp: validDate.getTime(),
          year,
          month,
          day
        };
      }

      return { dateStr: getTodayFormatted(), timestamp: Date.now(), year: new Date().getFullYear(), month: new Date().getMonth() + 1, day: new Date().getDate() };
    };

    const parseDateForSort = (dateStr) => {

      let detectedTotal = 0;
      let detectedCategory = 'Supermarket';
      let detectedSubcategory = '';

        { name: 'Σκλαβενίτης', match: ['σκλαβενιτ', 'sklav', 'hypermarket'], category: 'Supermarket' },
        { name: 'ΑΒ Βασιλόπουλος', match: ['βασιλοπουλ', 'vassilop', 'αβ '], category: 'Supermarket' },

        { name: 'BP Gas', match: ['bp ', 'βπ'], category: 'Fuel & Transport' },
        { name: 'Avin Gas', match: ['avin', 'αβιν'], category: 'Fuel & Transport' },
        { name: 'Jumbo', match: ['jumbo', 'τζαμπο'], category: 'Shopping & Gifts' },
        { name: 'Zara', match: ['zara', 'ζαρα'], category: 'Shopping & Gifts' },
        { name: 'H&M', match: ['h&m', 'hennes'], category: 'Shopping & Gifts' },
        { name: 'Public', match: ['public', 'παμπλικ'], category: 'Education & Hobbies' },
        { name: 'Coffee Island', match: ['coffee island', 'καφε'], category: 'Dining & Coffee' },
        { name: 'Everest', match: ['everest', 'εβερεστ'], category: 'Dining & Coffee' },
        { name: 'Γρηγόρης', match: ['γρηγορη', 'grigoris'], category: 'Dining & Coffee' },
        { name: 'Φαρμακείο', match: ['φαρμακ', 'pharmacy', 'αποστολοπ'], category: 'Health & Pharmacy' }
      ];

      const textLower = text.toLowerCase();

      for (const store of KNOWN_STORES) {
        if (store.match.some(m => textLower.includes(m))) {
          detectedMerchant = store.name;
          detectedCategory = store.category;
          break;
        }
      }

      if (!detectedMerchant) {
        for (let i = 0; i < Math.min(5, lines.length); i++) {
          const cleanLine = lines[i].replace(/[^a-zA-Zα-ωΑ-Ω0-9\s]/g, '').trim();
          if (cleanLine.length >= 3 && !/^\d+$/.test(cleanLine)) {
            detectedMerchant = lines[i].slice(0, 35);
            break;
          }
        }
      }
      if (!detectedMerchant) detectedMerchant = 'Απόδειξη (Σαρωμένη)';

      const dateMatch = text.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
      if (dateMatch) {
        detectedDate = parseSmartDate(dateMatch[0]).dateStr;
      }

      const amountRegex = /(?:συνολο|total|πληρωτεο|καθαρο|ευρω|eur|€)\s*[:=]?\s*([0-9]+[.,][0-9]{2})/gi;
      let match;
      let foundTotals = [];
      while ((match = amountRegex.exec(text)) !== null) {
        const val = parseFloat(match[1].replace(',', '.'));
        if (!isNaN(val) && val > 0 && val < 5000) {
          foundTotals.push(val);
        }
      }

      if (foundTotals.length > 0) {
        detectedTotal = Math.max(...foundTotals);
      } else {
        const generalPriceMatches = text.match(/\b([0-9]{1,4}[.,][0-9]{2})\b/g);
        if (generalPriceMatches) {
          const nums = generalPriceMatches.map(p => parseFloat(p.replace(',', '.'))).filter(n => n > 0 && n < 2000);
          if (nums.length > 0) detectedTotal = Math.max(...nums);
        }
      }

      const itemLines = [];
      for (const line of lines) {
        if (line.length > 3 && !line.toLowerCase().includes('αφμ') && !line.toLowerCase().includes('τηλ') && !line.toLowerCase().includes('ευχαριστ') && !line.toLowerCase().includes('συνολο') && !line.toLowerCase().includes('αποδειξη')) {
          if (/[a-zA-Zα-ωΑ-Ω]/.test(line)) {
            itemLines.push(line.replace(/[0-9]+[.,][0-9]{2}/g, '').trim());
          }
        }
      }
      if (itemLines.length > 1) {
        detectedSubcategory = itemLines.slice(1, 4).join(', ').slice(0, 60);
      } else {
        detectedSubcategory = 'Είδη / Προϊόντα Αγοράς';
      }

      return {
        merchant: detectedMerchant,
        category: detectedCategory,
        subcategory: detectedSubcategory,
        total: detectedTotal > 0 ? detectedTotal.toFixed(2) : '',
        date: detectedDate,
        rawText: text
      };
    };

    function DynamicChart({ type, data, options, height = 260 }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        try {
          chartInstanceRef.current = new window.Chart(canvasRef.current, {
            type,
            data,
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: {
                    boxWidth: 12,
                    font: { size: 11, family: 'sans-serif' },
                    padding: 10
                  }
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      let label = context.dataset?.label || context.label || '';
                      if (label) label += ': ';
                      const val = context.parsed?.y !== undefined ? context.parsed.y : context.parsed;
                      if (typeof val === 'number') {
                        label += '€' + val.toFixed(2);
                      }
                      return label;
                    }
                  }
                }
              },
              ...options
            }
          });
        } catch (err) {
          console.error("Chart render error:", err);
        }

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [type, data, options]);

      return (
        <div style={{ position: 'relative', height: `${height}px`, width: '100%' }}>
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

              const parsedTotal = parseFloat(String(rawAmount).replace(',', '.'));

              if (isNaN(parsedTotal) || parsedTotal <= 0) return;

              let merchantVal = '';

                const kLower = key.toLowerCase();
                if (kLower.includes('κατάστημα') || kLower.includes('καταστημα') || kLower.includes('παραλήπτης') || kLower.includes('παραληπτης') || kLower.includes('merchant') || kLower.includes('προμηθευτής')) {

              if (!merchantVal) {

              const rawCat = (row['Κατηγορία Εξόδου'] || row['Κατηγορία'] || row['Category'] || row['Είδος Εξόδου'] || '').toString().trim();

              let categoryKey = 'Uncategorized';
              if (rawCat) {
                const catLower = rawCat.toLowerCase();
                const matched = CATEGORIES.find(c => c.id.toLowerCase() === catLower || c.label.toLowerCase().includes(catLower));

                if (matched) {
                  categoryKey = matched.id;
                } else if (catLower.includes('υπεραγορ') || catLower.includes('supermarket') || catLower.includes('τροφιμ')) categoryKey = 'Supermarket';
                else if (catLower.includes('δανει') || catLower.includes('εφορια') || catLower.includes('τραπεζ')) categoryKey = 'Loans & Tax';

                else if (catLower.includes('φαρμακ') || catLower.includes('γιατρ')) categoryKey = 'Health & Pharmacy';
                else if (catLower.includes('λογαριασμ') || catLower.includes('bills')) categoryKey = 'Utilities & Bills';
                else if (catLower.includes('σχολικ') || catLower.includes('φροντιστ')) categoryKey = 'Education & Hobbies';
                else if (catLower.includes('ενοικιο')) categoryKey = 'Rent';
                else if (catLower.includes('τσιγαρ')) categoryKey = 'Cigarettes';
                else if (catLower.includes('ψωνια') || catLower.includes('δωρα')) categoryKey = 'Shopping & Gifts';

              const subcatVal = (row['Υποκατηγορία / Περιγραφή'] || row['Υποκατηγορία'] || row['Περιγραφή'] || row['Λεπτομέρειες'] || '').toString().trim();

              return;

      // Distinct Months Available for Filtering

          const p = parseSmartDate(r.date);

          count,
          dayOfMonth: days,

          }
        });

        return BENEFICIARY_OPTIONS.map(b => ({
          name: b,
          total: counts[b] || 0,
          percent: currentMonthTotal > 0 ? ((counts[b] || 0) / currentMonthTotal) * 100 : 0

          const payerSum = mRecs.reduce((acc, r) => acc + r.total, 0);

          const beneficiarySum = currentMonthReceipts.reduce((acc, r) => {
            const ben = r.beneficiary || 'Όλη η Οικογένεια';
            if (ben === m.name) {
              return acc + r.total;
            } else if ((m.id === 'aggeliki' || m.id === 'christina') && (ben.includes('Κορίτσια') || ben.toLowerCase().includes('κοριτσ'))) {
              return acc + (r.total / 2);

            return acc;
          }, 0);

          const percent = currentMonthTotal > 0 ? (payerSum / currentMonthTotal) * 100 : 0;
          return { ...m, count: mRecs.length, total: payerSum, beneficiarySum, percent };

      const categoryBreakdown = useMemo(() => {

          const percent = currentMonthTotal > 0 ? (sum / currentMonthTotal) * 100 : 0;

            datasets: [{ data: [1], backgroundColor: ['#e2e8f0'] }]

          const actual = currentMonthReceipts.filter(r => r.category === cat.id).reduce((acc, r) => acc + r.total, 0);
          const diff = budgeted - actual;
          const percent = budgeted > 0 ? (actual / budgeted) * 100 : 0;
          return {
            ...cat,
            budgeted,
            actual,
            diff,
            percent,
            isFixed: !!fixedItem

      const filteredReceipts = useMemo(() => {
        const filtered = activeReceipts.filter((r) => {

                                r.memberName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                ben.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = categoryFilter === 'All' || r.category === categoryFilter;
          const matchesMember = memberFilter === 'All' || r.memberId === memberFilter;
          const matchesBeneficiary = beneficiaryFilter === 'All' || 
                                     ben === beneficiaryFilter ||
                                     (beneficiaryFilter === 'Κορίτσια' && (ben.includes('Κορίτσια') || ben.toLowerCase().includes('κοριτσ')));

          let matchesMonth = true;
          if (selectedMonth !== 'ALL') {

            const mStr = `${String(p.month).padStart(2, '0')}/${p.year}`;
            matchesMonth = (mStr === selectedMonth);
          }

          return matchesSearch && matchesCategory && matchesMember && matchesBeneficiary && matchesMonth;
        });

        return filtered.sort((a, b) => {
          let valA, valB;

          if (sortField === 'date') {
            valA = parseDateForSort(a.date);
            valB = parseDateForSort(b.date);
          } else if (sortField === 'registrationDate') {
            valA = a.registrationDate || a.date;
            valB = b.registrationDate || b.date;
          } else if (sortField === 'total') {
            valA = a.total;
            valB = b.total;
          } else if (sortField === 'merchant') {
            valA = a.merchant.toLowerCase();
            valB = b.merchant.toLowerCase();
          } else if (sortField === 'subcategory') {
            valA = (a.subcategory || '').toLowerCase();
            valB = (b.subcategory || '').toLowerCase();
          } else if (sortField === 'category') {
            valA = a.category.toLowerCase();
            valB = b.category.toLowerCase();
          } else if (sortField === 'memberName') {
            valA = a.memberName.toLowerCase();
            valB = b.memberName.toLowerCase();
          } else if (sortField === 'beneficiary') {
            valA = (a.beneficiary || '').toLowerCase();
            valB = (b.beneficiary || '').toLowerCase();
          } else {
            valA = parseDateForSort(a.date);
            valB = parseDateForSort(b.date);
          }

          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;

                    </h3>
                    <button onClick={() => setShowExcelImportModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                  </div>

                  {/* Date Format Selector */}
                  <div className="space-y-2 bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                    <label className="text-xs font-bold text-indigo-950 block">
                      📅 Επιλογή Μορφής Ημερομηνιών στο Excel:
                    </label>
                    <p className="text-[11px] text-indigo-700">
                      Αν οι αποδείξεις σας είχαν εμφανιστεί όλες στον Νοέμβριο, επιλέξτε την κατάλληλη μορφή παρακάτω:
                    </p>
                    <div className="space-y-2 pt-1">
                      <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                        <input
                          type="radio"
                          name="dateFormatOption"
                          value="auto"
                          checked={excelDateFormat === 'auto'}
                          onChange={() => setExcelDateFormat('auto')}
                          className="text-indigo-600"
                        />
                        <span>🔄 <strong>Αυτόματη Αναγνώριση</strong> (Έξυπνη διατήρηση έτους & ημερομηνίας)</span>
                      </label>
                      <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                        <input
                          type="radio"
                          name="dateFormatOption"
                          value="dmy"
                          checked={excelDateFormat === 'dmy'}
                          onChange={() => setExcelDateFormat('dmy')}
                          className="text-indigo-600"
                        />
                        <span>🇬🇷 <strong>Ημέρα / Μήνας / Έτος</strong> (DD/MM/YYYY - Ευρωπαϊκή μορφή)</span>
                      </label>
                      <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                        <input
                          type="radio"
                          name="dateFormatOption"
                          value="mdy"
                          checked={excelDateFormat === 'mdy'}
                          onChange={() => setExcelDateFormat('mdy')}
                          className="text-indigo-600"
                        />
                        <span>🇺🇸 <strong>Μήνας / Ημέρα / Έτος</strong> (MM/DD/YYYY - αν το Excel έχει πρώτα τον Μήνα)</span>
                      </label>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <button
                      onClick={() => excelImportRef.current?.click()}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow flex items-center justify-center gap-2"
                    >
                      <span>📁</span>
                      <span>Επιλογή Αρχείου Excel</span>
                    </button>
                    <button
                      onClick={downloadTemplate}
                      className="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold border border-slate-200 transition flex items-center justify-center gap-2"
                    >
                      <span>📄</span>
                      <span>Λήψη Προτύπου Excel</span>
                    </button>
                  </div>

                  {/* Clean for Re-Import Danger Zone */}
                  <div className="pt-4 border-t space-y-2">
                    <h4 className="text-xs font-bold text-rose-800 flex items-center gap-1.5">
                      <span>🧹</span>
                      <span>Καθαρισμός & Επανεισαγωγή (Διόρθωση Ημερομηνιών):</span>
                    </h4>
                    <p className="text-[11px] text-slate-500">
                      Αν θέλετε να σβήσετε τις αποδείξεις που είχαν λάθος ημερομηνία και να ξανανεβάσετε το Excel σας καθαρά:
                    </p>
                    <button
                      onClick={cleanAllReceiptsForReimport}
                      className="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2"
                    >
                      <span>⚠️</span>
                      <span>Καθαρισμός όλων των παλιών δεδομένων για επανεισαγωγή</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL 4: DASHBOARD PANELS CUSTOMIZE MODAL (SHOW/HIDE WITH LOCALSTORAGE MEMORY) */}
            {showCustomizeModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                  <div className="flex items-center justify-between border-b pb-3">
                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                      <span>⚙️</span>
                      <span>Προσαρμογή Εμφάνισης Dashboard</span>
                    </h3>
                    <button onClick={() => setShowCustomizeModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                  </div>

                  <p className="text-xs text-slate-500">
                    Επιλέξτε ποια panels θέλετε να εμφανίζονται. Η εφαρμογή αποθηκεύει αυτόματα τις επιλογές σας στη μνήμη.
                  </p>

                  <div className="space-y-3 pt-1">
                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">⏳ Εβδομαδιαίο Όριο & Στόχος Μήνα</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.weeklyAllowance}
                        onChange={() => toggleWidget('weeklyAllowance')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">🥧 Πίτα Εξόδων ανά Κατηγορία</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.categoryPie}
                        onChange={() => toggleWidget('categoryPie')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">🎯 Πίτα Εξόδων ανά Δικαιούχο</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.beneficiaryPie}
                        onChange={() => toggleWidget('beneficiaryPie')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">📊 Προϋπολογισμός vs Απολογισμός</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.budgetVsActual}
                        onChange={() => toggleWidget('budgetVsActual')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">📈 Εβδομαδιαία Τάση Εξόδων (1-4)</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.weeklyTrend}
                        onChange={() => toggleWidget('weeklyTrend')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">👨‍👩‍👧‍👦 Πληρωμές ανά Μέλος</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.memberStats}
                        onChange={() => toggleWidget('memberStats')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">🏷️ Πλέγμα 12 Κατηγοριών</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.categoryGrid}
                        onChange={() => toggleWidget('categoryGrid')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>

                    <label className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 cursor-pointer transition">
                      <span className="text-xs font-bold text-slate-800">⚡ Μπάρα Γρήγορης Καταχώρησης</span>
                      <input
                        type="checkbox"
                        checked={!!widgets.quickActions}
                        onChange={() => toggleWidget('quickActions')}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </label>
                  </div>

                  <div className="pt-3 border-t flex justify-end">
                    <button
                      onClick={() => setShowCustomizeModal(false)}
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow"
                    >
                      Έτοιμο
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL 5: DELETE / CLEANUP MODAL WITH DATE LIMIT */}
            {showDeleteModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                  <div className="flex items-center justify-between border-b pb-3">
                    <h3 className="text-base font-bold text-slate-800">🗑️ Εκκαθάριση Δεδομένων & Όριο Ημερομηνίας</h3>
                    <button onClick={() => setShowDeleteModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                  </div>

                  <p className="text-xs text-slate-500 leading-relaxed">
                    Επιλέξτε αν θέλετε να διαγράψετε εγγραφές παλαιότερες από μια ημερομηνία ή να κάνετε πλήρη διαγραφή.
                  </p>

                  <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <label className="text-xs font-bold text-slate-700 block">
                      📅 Διαγραφή εγγραφών παλαιότερων από (ΗΗ/ΜΜ/ΕΕ):
                    </label>
                    <input
                      type="text"
                      placeholder="π.χ. 01/10/26"
                      value={deleteDateLimit}
                      onChange={(e) => setDeleteDateLimit(e.target.value)}
                      className="w-full px-3 py-2 border rounded-xl text-xs font-mono font-bold bg-white"
                    />

                    <div className="flex gap-2 pt-1">
                      <button
                        onClick={() => {
                          if (!deleteDateLimit) {
                            showAlert('Παρακαλώ συμπληρώστε μια ημερομηνία σε μορφή ΗΗ/ΜΜ/ΕΕ');
                            return;
                          }
                          const limitTimestamp = parseDateForSort(deleteDateLimit);
                          if (!limitTimestamp) {
                            showAlert('Μη έγκυρη μορφή ημερομηνίας.');
                            return;
                          }

                          const toDelete = activeReceipts.filter(r => parseDateForSort(r.date) < limitTimestamp);
                          const deletedCount = toDelete.length;

                          if (deletedCount === 0) {
                            showAlert(`Δεν βρέθηκαν εγγραφές παλαιότερες από ${deleteDateLimit}.`);
                            return;
                          }

                          showConfirm(`Θέλετε να μεταφέρετε ${deletedCount} παλιές εγγραφές στον Κάδο Ανακύκλωσης;`, async () => {
                            if (db) {
                              const batch = db.batch();
                              toDelete.forEach(r => {
                                batch.set(db.collection('receipts').doc(r.id), { isDeleted: true, deletedAt: new Date().toISOString() }, { merge: true });
                              });
                              await batch.commit();
                            } else {
                              setReceipts(prev => prev.map(r => parseDateForSort(r.date) < limitTimestamp ? { ...r, isDeleted: true } : r));
                            }
                            setShowDeleteModal(false);
                            setDeleteDateLimit('');
                            showAlert(`Μεταφέρθηκαν ${deletedCount} παλιές εγγραφές στον Κάδο.`);
                          });
                        }}
                        className="flex-1 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl transition"
                      >
                        🗑️ Μεταφορά Παλαιότερων στον Κάδο
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 border-t flex flex-col gap-2">
                    <button
                      onClick={() => {
                        showConfirm('ΠΡΟΣΟΧΗ: Θέλετε να μεταφέρετε ΟΛΕΣ τις καταχωρημένες αποδείξεις στον Κάδο Ανακύκλωσης; (Μπορείτε να τις επαναφέρετε ανά πάσα στιγμή)', async () => {
                          if (db) {
                            const BATCH_SIZE = 400;
                            for (let i = 0; i < activeReceipts.length; i += BATCH_SIZE) {
                              const chunk = activeReceipts.slice(i, i + BATCH_SIZE);
                              const batch = db.batch();
                              chunk.forEach(r => {
                                batch.set(db.collection('receipts').doc(r.id), { isDeleted: true, deletedAt: new Date().toISOString() }, { merge: true });
                              });
                              await batch.commit();
                            }
                          } else {
                            setReceipts(prev => prev.map(r => ({ ...r, isDeleted: true })));
                          }
                          setShowDeleteModal(false);
                          showAlert("Όλες οι αποδείξεις μεταφέρθηκαν στον Κάδο. Μπορείτε να τις επαναφέρετε από τον Κάδο!");
                        });
                      }}
                      className="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl transition"
                    >
                      ⚠️ Μεταφορά Όλων στον Κάδο
                    </button>
                    <button
                      onClick={() => setShowDeleteModal(false)}
                      className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                    >
                      Ακύρωση
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL 6: CUSTOM ALERT / CONFIRM DIALOG */}
            {dialogState.isOpen && (
              <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                  <div className="flex items-center gap-2 border-b pb-3">
                    <span className="text-lg">{dialogState.type === 'confirm' ? '⚠️' : 'ℹ️'}</span>
                    <h3 className="text-sm font-bold text-slate-800">
                      {dialogState.type === 'confirm' ? 'Επιβεβαίωση Ενέργειας' : 'Ενημέρωση'}
                    </h3>
                  </div>
                  <p className="text-xs text-slate-600 leading-relaxed">{dialogState.message}</p>
                  <div className="flex justify-end gap-2 pt-2">
                    {dialogState.type === 'confirm' && (
                      <button
                        onClick={() => setDialogState({ ...dialogState, isOpen: false })}
                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                      >
                        Ακύρωση
                      </button>
                    )}
                    <button
                      onClick={() => {
                        const cb = dialogState.onConfirm;
                        setDialogState({ ...dialogState, isOpen: false });
                        if (cb) cb();
                      }}
                      className={`px-5 py-2 text-white rounded-xl text-xs font-bold shadow-md transition ${
                        dialogState.type === 'confirm' ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'
                      }`}
                    >
                      {dialogState.type === 'confirm' ? 'Επιβεβαίωση' : 'Εντάξει'}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
